# Container log rotation (docker json-file driver): at most max-file x max-size per container.
# Without it the logs grow without bound on the host disk shared with every other service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  sillytavern:
    build: ..
    container_name: sillytavernmod
    hostname: sillytavernmod
    image: sakurajiamai/sillytavernmod:latest

    environment:
      - NODE_ENV=production
      - FORCE_COLOR=1
      - SILLYTAVERN_HEARTBEATINTERVAL=30

    ports:
      - "8000:8000"

    volumes:
      - "./config:/home/node/app/config"
      - "./data:/home/node/app/data"
      - "./plugins:/home/node/app/plugins"
      - "./extensions:/home/node/app/public/scripts/extensions/third-party"

    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    restart: unless-stopped
    logging: *default-logging
